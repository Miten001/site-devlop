<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Join Free — FlexFam</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<div class="aurora"><span></span><span></span><span></span></div>

<header class="site-head">
  <div class="container bar">
    <a class="logo" href="index.html"><span data-brand></span>Flex<b>Fam</b></a>
    <div class="head-actions">
      <a href="index.html" class="btn btn-ghost btn-sm always">← Home</a>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card reveal in">
    <h1>Join the <span class="grad-text">Fam</span> 🎉</h1>
    <p class="sub">Set up your account in 2 minutes — get <b style="color:var(--green)">+25 bonus points</b> today.</p>
    <form id="signup-form">
      <div class="field">
        <label for="name">Display name</label>
        <input type="text" name="name" id="name" placeholder="e.g. Rohan Sharma" required autocomplete="name" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" name="email" id="email" placeholder="you@example.com" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" name="password" id="password" placeholder="min 8 characters" minlength="8" required autocomplete="new-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Create Account &amp; Claim 25 Points</button>
    </form>
    <div class="divider">or</div>
    <button class="btn btn-ghost btn-block" id="demo-login" type="button">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4.5 13.5H11L9.5 22 19 10h-6.5L13 2z"/></svg>
      Try the one-click demo account
    </button>
    <p class="auth-alt">Already a member? <a href="login.html">Log in</a></p>
    <p class="auth-security">Your raw password stays private — staff cannot see it and it is never shown in the admin panel.</p>
    <p class="text-mute" style="text-align:center;font-size:12px;margin-top:14px">By signing up you agree to our <a href="#" style="text-decoration:underline">Terms</a> and <a href="#" style="text-decoration:underline">Privacy Policy</a>.</p>
  </div>
</div>

<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/ff-analytics.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
