<svg xmlns="http://www.w3.org/2000/svg" width="728" height="90" viewBox="0 0 728 90" role="img" aria-label="FlexFam earn USDT daily banner">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#060b1d"/>
    <stop offset="0.54" stop-color="#102347"/>
    <stop offset="1" stop-color="#072b21"/>
  </linearGradient>
  <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#34e5a5"/>
    <stop offset="1" stop-color="#ffd061"/>
  </linearGradient>
  <linearGradient id="cta" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffd061"/>
    <stop offset="1" stop-color="#34e5a5"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#34e5a5" stop-opacity=".45"/>
    <stop offset="1" stop-color="#34e5a5" stop-opacity="0"/>
  </radialGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".36"/>
  </filter>
</defs>
<style>
  .brand{font-family:Inter,Arial,sans-serif;font-weight:900;letter-spacing:-0.04em;fill:#fff}
  .brand tspan{fill:#ffd061}
  .eyebrow{font-family:Inter,Arial,sans-serif;font-weight:800;letter-spacing:.16em;text-transform:uppercase;fill:#8df2c4}
  .headline{font-family:Inter,Arial,sans-serif;font-weight:900;letter-spacing:-0.055em;fill:#fff}
  .sub{font-family:Inter,Arial,sans-serif;font-weight:700;fill:#c9d6f4}
  .muted{font-family:Inter,Arial,sans-serif;font-weight:650;fill:#8ea0c7}
  .cta{font-family:Inter,Arial,sans-serif;font-weight:900;letter-spacing:.02em;fill:#071528}
  .small{font-family:Inter,Arial,sans-serif;font-weight:700;fill:#dfe8ff}
  .green{fill:#34e5a5}.gold{fill:#ffd061}.orange{fill:#ff9f2f}
</style>
<rect width="728" height="90" rx="10" fill="url(#bg)"/>

  <circle cx="597.0" cy="16.2" r="28.8" fill="url(#glow)" opacity=".75"/>
  <circle cx="87.4" cy="66.6" r="21.6" fill="#ff9f2f" opacity=".13"/>
  <path d="M58.2 18.0C203.8 5.4 342.2 8.1 509.6 1.8" fill="none" stroke="#34e5a5" stroke-opacity=".22" stroke-width="3"/>
  <path d="M364.0 88.2C480.5 73.8 597.0 74.7 698.9 56.7" fill="none" stroke="#ffd061" stroke-opacity=".18" stroke-width="4"/>
  <g opacity=".18" fill="#fff">
    <circle cx="131.0" cy="19.8" r="3"/><circle cx="313.0" cy="70.2" r="2.5"/><circle cx="546.0" cy="52.2" r="3.5"/>
  </g>

  <text x="16" y="41" class="brand" font-size="25">Flex<tspan>Fam</tspan></text>
  <text x="16" y="58" class="sub" font-size="14">FREE tasks • daily streak • USDT withdrawals</text>
  <g filter="url(#shadow)">
    <text x="342" y="50" class="headline green" font-size="30">$5.50/day</text>
    <text x="349" y="70" class="muted" font-size="11">Day 90+ streak earning</text>
  </g>
  <rect x="589" y="20" width="109" height="45" rx="22" fill="url(#cta)"/>
  <text x="643" y="50" class="cta" font-size="12" text-anchor="middle">JOIN FREE</text>

</svg>
