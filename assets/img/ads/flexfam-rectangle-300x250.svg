<svg xmlns="http://www.w3.org/2000/svg" width="300" height="250" viewBox="0 0 300 250" role="img" aria-label="FlexFam Earn USDT 300x250">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="r300_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814"/>
      <stop offset="40%" stop-color="#091326"/>
      <stop offset="100%" stop-color="#041a15"/>
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="r300_card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(16, 35, 71, 0.75)"/>
      <stop offset="100%" stop-color="rgba(7, 18, 38, 0.9)"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="r300_borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 245, 155, 0.6)"/>
      <stop offset="50%" stop-color="rgba(255, 208, 67, 0.4)"/>
      <stop offset="100%" stop-color="rgba(0, 229, 255, 0.2)"/>
    </linearGradient>

    <!-- Gold Text Gradient -->
    <linearGradient id="r300_gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff076"/>
      <stop offset="50%" stop-color="#ffd043"/>
      <stop offset="100%" stop-color="#ff9a00"/>
    </linearGradient>

    <!-- Emerald Text Gradient -->
    <linearGradient id="r300_emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f59b"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="r300_btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd043"/>
      <stop offset="45%" stop-color="#00f59b"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <!-- 3D Coin Outer Rim Gradient -->
    <linearGradient id="r300_goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe484"/>
      <stop offset="40%" stop-color="#ffd043"/>
      <stop offset="70%" stop-color="#e69500"/>
      <stop offset="100%" stop-color="#804a00"/>
    </linearGradient>

    <!-- 3D Coin Inner Face Gradient -->
    <radialGradient id="r300_coinFace" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3bf6ad"/>
      <stop offset="60%" stop-color="#14966a"/>
      <stop offset="100%" stop-color="#08523a"/>
    </radialGradient>

    <!-- Ambient Glow Filters -->
    <radialGradient id="r300_glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f59b" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#00f59b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00f59b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="r300_glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd043" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#ff9a00" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ff9a00" stop-opacity="0"/>
    </radialGradient>

    <filter id="r300_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <style>
    .brand { font-family: Inter, system-ui, -apple-system, Roboto, 'Segoe UI', Arial, sans-serif; font-weight: 900; }
    .title { font-family: Inter, system-ui, -apple-system, Roboto, 'Segoe UI', Arial, sans-serif; font-weight: 800; }
    .body { font-family: Inter, system-ui, -apple-system, Roboto, 'Segoe UI', Arial, sans-serif; font-weight: 600; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 700; }
  </style>


  <rect width="300" height="250" rx="16" fill="url(#r300_bg)"/>
  <rect width="300" height="250" rx="16" fill="none" stroke="url(#r300_borderGrad)" stroke-width="1.4"/>

  <circle cx="150" cy="35" r="100" fill="url(#r300_glowGold)"/>
  <circle cx="150" cy="135" r="120" fill="url(#r300_glowGreen)"/>

  <!-- Logo Header -->
  <g transform="translate(0, 16)">
    <text x="150" y="25" class="brand" font-size="26" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5px">Flex<tspan fill="url(#r300_gold)">Fam</tspan></text>
    
    <g transform="translate(72, 33)">
      <rect x="0" y="0" width="156" height="18" rx="9" fill="rgba(0,245,155,0.15)" stroke="rgba(0,245,155,0.3)" stroke-width="1"/>
      <path transform="translate(8, 2) scale(0.9)" d="M7 1L1 9h5l-2 7 8-9H7l2-7z" fill="#00f59b"/>
      <text x="80" y="13" class="title" font-size="9" fill="#00f59b" text-anchor="middle" letter-spacing="0.8px">FREE SOCIAL EARNING</text>
    </g>
  </g>

  <!-- Feature Center Card -->
  <g transform="translate(20, 76)">
    <rect width="260" height="98" rx="14" fill="url(#r300_card)" stroke="rgba(0,245,155,0.3)" stroke-width="1.2"/>
    
    <!-- 3D Coin -->
    
    <g transform="translate(42, 49)" filter="url(#r300_shadow)">
      <!-- Outer Gold Bevel -->
      <circle cx="0" cy="0" r="26" fill="url(#r300_goldRim)"/>
      <!-- Inner Green Face -->
      <circle cx="0" cy="0" r="22.36" fill="url(#r300_coinFace)"/>
      <circle cx="0" cy="0" r="22.36" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.2999999999999998"/>
      
      <!-- Tether T & Rings Vector -->
      <g transform="scale(1.0833333333333333) translate(-12, -12)">
        <!-- Top Bar -->
        <rect x="5.5" y="6" width="13" height="3" rx="1" fill="#ffffff"/>
        <!-- Vertical Stem -->
        <rect x="10.5" y="8" width="3" height="10" rx="0.8" fill="#ffffff"/>
        <!-- Ring Arc Left & Right -->
        <path d="M 6 12.5 C 6 11 8.5 10 12 10 C 15.5 10 18 11 18 12.5 C 18 14 15.5 15 12 15 C 8.5 15 6 14 6 12.5 Z" fill="none" stroke="#ffffff" stroke-width="1.8"/>
      </g>
      <!-- Top Specular Highlight -->
      <ellipse cx="-6.5" cy="-9.1" rx="9.1" ry="4.68" fill="rgba(255,255,255,0.35)"/>
    </g>
  

    <g transform="translate(82, 14)">
      <text x="0" y="14" class="title" font-size="10" fill="#9fb0d5">EARN UP TO</text>
      <g transform="translate(0, 42)">
        <text x="0" y="0" class="brand" font-size="30" fill="url(#r300_emerald)" letter-spacing="-0.8px">$5.50</text>
        <text x="96" y="-3" class="brand" font-size="16" fill="#ffffff">/ DAY</text>
      </g>
      <g transform="translate(0, 62)">
        <path transform="translate(0, 0) scale(0.9)" d="M1 5l3 3L11 1" fill="none" stroke="#ffd043" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="14" y="8" class="title" font-size="10.5" fill="#ffd043">Telegram • YouTube • Web</text>
      </g>
    </g>
  </g>

  <!-- CTA -->
  <g transform="translate(20, 186)">
    <rect width="260" height="42" rx="21" fill="url(#r300_btn)" filter="url(#r300_shadow)"/>
    <rect x="2" y="2" width="256" height="18" rx="9" fill="rgba(255,255,255,0.35)"/>
    <text x="130" y="26" class="brand" font-size="15" fill="#051020" text-anchor="middle" letter-spacing="0.3px">CLAIM FREE USDT ➔</text>
  </g>
  <text x="150" y="240" class="body" font-size="9" fill="#8ea5c8" text-anchor="middle">Instant Withdrawals • BEP20 &amp; UPI</text>
</svg>