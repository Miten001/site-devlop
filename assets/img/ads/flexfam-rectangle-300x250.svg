<svg xmlns="http://www.w3.org/2000/svg" width="300" height="250" viewBox="0 0 300 250" role="img" aria-label="FlexFam earn USDT daily banner">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#060b1d"/>
    <stop offset="0.54" stop-color="#102347"/>
    <stop offset="1" stop-color="#072b21"/>
  </linearGradient>
  <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#34e5a5"/>
    <stop offset="1" stop-color="#ffd061"/>
  </linearGradient>
  <linearGradient id="cta" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffd061"/>
    <stop offset="1" stop-color="#34e5a5"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#34e5a5" stop-opacity=".45"/>
    <stop offset="1" stop-color="#34e5a5" stop-opacity="0"/>
  </radialGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".36"/>
  </filter>
</defs>
<style>
  .brand{font-family:Inter,Arial,sans-serif;font-weight:900;letter-spacing:-0.04em;fill:#fff}
  .brand tspan{fill:#ffd061}
  .eyebrow{font-family:Inter,Arial,sans-serif;font-weight:800;letter-spacing:.16em;text-transform:uppercase;fill:#8df2c4}
  .headline{font-family:Inter,Arial,sans-serif;font-weight:900;letter-spacing:-0.055em;fill:#fff}
  .sub{font-family:Inter,Arial,sans-serif;font-weight:700;fill:#c9d6f4}
  .muted{font-family:Inter,Arial,sans-serif;font-weight:650;fill:#8ea0c7}
  .cta{font-family:Inter,Arial,sans-serif;font-weight:900;letter-spacing:.02em;fill:#071528}
  .small{font-family:Inter,Arial,sans-serif;font-weight:700;fill:#dfe8ff}
  .green{fill:#34e5a5}.gold{fill:#ffd061}.orange{fill:#ff9f2f}
</style>
<rect width="300" height="250" rx="17" fill="url(#bg)"/>

  <circle cx="246.0" cy="45.0" r="80.0" fill="url(#glow)" opacity=".75"/>
  <circle cx="36.0" cy="185.0" r="60.0" fill="#ff9f2f" opacity=".13"/>
  <path d="M24.0 50.0C84.0 15.0 141.0 22.5 210.0 5.0" fill="none" stroke="#34e5a5" stroke-opacity=".22" stroke-width="3"/>
  <path d="M150.0 245.0C198.0 205.0 246.0 207.5 288.0 157.5" fill="none" stroke="#ffd061" stroke-opacity=".18" stroke-width="4"/>
  <g opacity=".18" fill="#fff">
    <circle cx="54.0" cy="55.0" r="3"/><circle cx="129.0" cy="195.0" r="2.5"/><circle cx="225.0" cy="145.0" r="3.5"/>
  </g>

  <text x="22" y="42" class="brand" font-size="24">Flex<tspan>Fam</tspan></text>
  <text x="150" y="72" class="eyebrow" font-size="11" text-anchor="middle">MAKE 60 SECONDS COUNT</text>
  <text x="150" y="124" class="headline green" font-size="42" text-anchor="middle">$5.50/day</text>
  <text x="150" y="152" class="sub" font-size="14" text-anchor="middle">Streaks • Tasks • Referrals</text>
  <g class="small" font-size="12">
    <text x="44" y="180">✓ Free 60 GH/s starter rig</text>
    <text x="44" y="199">✓ Real USDT withdrawal flow</text>
  </g>
  <rect x="72" y="211" width="156" height="32" rx="16" fill="url(#cta)"/>
  <text x="150" y="232" class="cta" font-size="12" text-anchor="middle">CLAIM DAY 1</text>

</svg>
