<svg xmlns="http://www.w3.org/2000/svg" width="468" height="60" viewBox="0 0 468 60" role="img" aria-label="FlexFam Earn USDT">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="b468_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814"/>
      <stop offset="40%" stop-color="#091326"/>
      <stop offset="100%" stop-color="#041a15"/>
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="b468_card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(16, 35, 71, 0.75)"/>
      <stop offset="100%" stop-color="rgba(7, 18, 38, 0.9)"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="b468_borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 245, 155, 0.6)"/>
      <stop offset="50%" stop-color="rgba(255, 208, 67, 0.4)"/>
      <stop offset="100%" stop-color="rgba(0, 229, 255, 0.2)"/>
    </linearGradient>

    <!-- Gold Text Gradient -->
    <linearGradient id="b468_gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff076"/>
      <stop offset="50%" stop-color="#ffd043"/>
      <stop offset="100%" stop-color="#ff9a00"/>
    </linearGradient>

    <!-- Emerald Text Gradient -->
    <linearGradient id="b468_emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f59b"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="b468_btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd043"/>
      <stop offset="45%" stop-color="#00f59b"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <!-- 3D Coin Outer Rim Gradient -->
    <linearGradient id="b468_goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe484"/>
      <stop offset="40%" stop-color="#ffd043"/>
      <stop offset="70%" stop-color="#e69500"/>
      <stop offset="100%" stop-color="#804a00"/>
    </linearGradient>

    <!-- 3D Coin Inner Face Gradient -->
    <radialGradient id="b468_coinFace" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3bf6ad"/>
      <stop offset="60%" stop-color="#14966a"/>
      <stop offset="100%" stop-color="#08523a"/>
    </radialGradient>

    <!-- Ambient Glow Filters -->
    <radialGradient id="b468_glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f59b" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#00f59b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00f59b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b468_glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd043" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#ff9a00" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ff9a00" stop-opacity="0"/>
    </radialGradient>

    <filter id="b468_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <style>
    .brand { font-family: Inter, system-ui, -apple-system, Roboto, 'Segoe UI', Arial, sans-serif; font-weight: 900; }
    .title { font-family: Inter, system-ui, -apple-system, Roboto, 'Segoe UI', Arial, sans-serif; font-weight: 800; }
    .body { font-family: Inter, system-ui, -apple-system, Roboto, 'Segoe UI', Arial, sans-serif; font-weight: 600; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 700; }
  </style>


  <rect width="468" height="60" rx="10" fill="url(#b468_bg)"/>
  <rect width="468" height="60" rx="10" fill="none" stroke="url(#b468_borderGrad)" stroke-width="1.2"/>

  <circle cx="35" cy="30" r="50" fill="url(#b468_glowGold)"/>
  <circle cx="230" cy="30" r="60" fill="url(#b468_glowGreen)"/>
  <circle cx="410" cy="30" r="50" fill="url(#b468_glowGreen)"/>

  <!-- Logo -->
  <g transform="translate(14, 11)">
    <text x="0" y="21" class="brand" font-size="20" fill="#ffffff" letter-spacing="-0.5px">Flex<tspan fill="url(#b468_gold)">Fam</tspan></text>
    <g transform="translate(0, 27)">
      <path transform="translate(0, 0) scale(0.9)" d="M7 1L1 9h5l-2 7 8-9H7l2-7z" fill="#00f59b"/>
      <text x="12" y="9" class="title" font-size="9.5" fill="#00f59b">FREE USDT</text>
    </g>
  </g>

  <!-- Value & Coin -->
  <g transform="translate(130, 9)">
    
    <g transform="translate(18, 21)" filter="url(#b468_shadow)">
      <!-- Outer Gold Bevel -->
      <circle cx="0" cy="0" r="18" fill="url(#b468_goldRim)"/>
      <!-- Inner Green Face -->
      <circle cx="0" cy="0" r="15.48" fill="url(#b468_coinFace)"/>
      <circle cx="0" cy="0" r="15.48" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.8999999999999999"/>
      
      <!-- Tether T & Rings Vector -->
      <g transform="scale(0.75) translate(-12, -12)">
        <!-- Top Bar -->
        <rect x="5.5" y="6" width="13" height="3" rx="1" fill="#ffffff"/>
        <!-- Vertical Stem -->
        <rect x="10.5" y="8" width="3" height="10" rx="0.8" fill="#ffffff"/>
        <!-- Ring Arc Left & Right -->
        <path d="M 6 12.5 C 6 11 8.5 10 12 10 C 15.5 10 18 11 18 12.5 C 18 14 15.5 15 12 15 C 8.5 15 6 14 6 12.5 Z" fill="none" stroke="#ffffff" stroke-width="1.8"/>
      </g>
      <!-- Top Specular Highlight -->
      <ellipse cx="-4.5" cy="-6.3" rx="6.3" ry="3.2399999999999998" fill="rgba(255,255,255,0.35)"/>
    </g>
  
    <g transform="translate(44, 4)">
      <g transform="translate(0, 18)">
        <text x="0" y="0" class="brand" font-size="22" fill="url(#b468_emerald)" letter-spacing="-0.5px">$5.50</text>
        <text x="74" y="-2" class="brand" font-size="13.5" fill="#ffffff">/ DAY</text>
      </g>
      <text x="0" y="33" class="body" font-size="9.5" fill="#9fb0d5">Daily Tasks • Instant Pay</text>
    </g>
  </g>

  <!-- CTA -->
  <g transform="translate(340, 12)">
    <rect x="0" y="0" width="114" height="36" rx="18" fill="url(#b468_btn)" filter="url(#b468_shadow)"/>
    <rect x="2" y="2" width="110" height="15" rx="7.5" fill="rgba(255,255,255,0.35)"/>
    <text x="57" y="23" class="brand" font-size="12.5" fill="#051020" text-anchor="middle">JOIN FREE ➔</text>
  </g>
</svg>