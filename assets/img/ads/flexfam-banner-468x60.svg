<svg xmlns="http://www.w3.org/2000/svg" width="468" height="60" viewBox="0 0 468 60" role="img" aria-label="FlexFam earn USDT daily banner">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#060b1d"/>
    <stop offset="0.54" stop-color="#102347"/>
    <stop offset="1" stop-color="#072b21"/>
  </linearGradient>
  <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#34e5a5"/>
    <stop offset="1" stop-color="#ffd061"/>
  </linearGradient>
  <linearGradient id="cta" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffd061"/>
    <stop offset="1" stop-color="#34e5a5"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#34e5a5" stop-opacity=".45"/>
    <stop offset="1" stop-color="#34e5a5" stop-opacity="0"/>
  </radialGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".36"/>
  </filter>
</defs>
<style>
  .brand{font-family:Inter,Arial,sans-serif;font-weight:900;letter-spacing:-0.04em;fill:#fff}
  .brand tspan{fill:#ffd061}
  .eyebrow{font-family:Inter,Arial,sans-serif;font-weight:800;letter-spacing:.16em;text-transform:uppercase;fill:#8df2c4}
  .headline{font-family:Inter,Arial,sans-serif;font-weight:900;letter-spacing:-0.055em;fill:#fff}
  .sub{font-family:Inter,Arial,sans-serif;font-weight:700;fill:#c9d6f4}
  .muted{font-family:Inter,Arial,sans-serif;font-weight:650;fill:#8ea0c7}
  .cta{font-family:Inter,Arial,sans-serif;font-weight:900;letter-spacing:.02em;fill:#071528}
  .small{font-family:Inter,Arial,sans-serif;font-weight:700;fill:#dfe8ff}
  .green{fill:#34e5a5}.gold{fill:#ffd061}.orange{fill:#ff9f2f}
</style>
<rect width="468" height="60" rx="10" fill="url(#bg)"/>

  <circle cx="383.8" cy="10.8" r="19.2" fill="url(#glow)" opacity=".75"/>
  <circle cx="56.2" cy="44.4" r="14.4" fill="#ff9f2f" opacity=".13"/>
  <path d="M37.4 12.0C131.0 3.6 220.0 5.4 327.6 1.2" fill="none" stroke="#34e5a5" stroke-opacity=".22" stroke-width="3"/>
  <path d="M234.0 58.8C308.9 49.2 383.8 49.8 449.3 37.8" fill="none" stroke="#ffd061" stroke-opacity=".18" stroke-width="4"/>
  <g opacity=".18" fill="#fff">
    <circle cx="84.2" cy="13.2" r="3"/><circle cx="201.2" cy="46.8" r="2.5"/><circle cx="351.0" cy="34.8" r="3.5"/>
  </g>

  <text x="14" y="30" class="brand" font-size="16">Flex<tspan>Fam</tspan></text>
  <text x="14" y="36" class="sub" font-size="12">FREE tasks • daily streak • USDT withdrawals</text>
  <g filter="url(#shadow)">
    <text x="219" y="33" class="headline green" font-size="20">$5.50/day</text>
    <text x="224" y="46" class="muted" font-size="10">Day 90+ streak earning</text>
  </g>
  <rect x="375" y="13" width="70" height="30" rx="15" fill="url(#cta)"/>
  <text x="410" y="33" class="cta" font-size="10" text-anchor="middle">JOIN FREE</text>

</svg>
