  <text x="24" y="48" class="brand" font-size="26">Flex<tspan>Fam</tspan></text>
  <text x="125.0" y="90.0" class="eyebrow" font-size="12" text-anchor="middle">FREE TO START</text>
  <text x="125.0" y="137.5" class="headline green" font-size="42" text-anchor="middle">$5.50/day</text>
  <text x="125.0" y="165.0" class="sub" font-size="14" text-anchor="middle">Daily streak + social tasks</text>
  <text x="125.0" y="185.0" class="muted" font-size="11" text-anchor="middle">No deposit • withdraw USDT</text>
  <rect x="55.0" y="200.0" width="140.0" height="36" rx="18" fill="url(#cta)"/>
  <text x="125.0" y="223.0" class="cta" font-size="13" text-anchor="middle">JOIN FREE</text>

