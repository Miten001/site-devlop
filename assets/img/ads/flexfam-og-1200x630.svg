  <text x="72" y="118" class="brand" font-size="62">Flex<tspan>Fam</tspan></text>
  <text x="72" y="188" class="eyebrow" font-size="24">FREE SOCIAL TASKS + USDT REWARDS</text>
  <text x="72" y="298" class="headline" font-size="76">Earn daily from</text>
  <text x="72" y="386" class="headline green" font-size="86">simple online tasks</text>
  <text x="76" y="458" class="sub" font-size="30">Daily streaks, referrals and cloud-mining bonuses in one FlexFam dashboard.</text>
  <rect x="76" y="506" width="260" height="62" rx="31" fill="url(#cta)"/>
  <text x="206" y="546" class="cta" font-size="24" text-anchor="middle">JOIN FREE</text>
  <g filter="url(#shadow)">
