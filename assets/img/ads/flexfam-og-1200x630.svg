    <text x="945" y="252" class="headline green" font-size="70" text-anchor="middle">$5.50</text>
    <text x="945" y="315" class="headline" font-size="46" text-anchor="middle">per day</text>
    <text x="945" y="366" class="muted" font-size="23" text-anchor="middle">Day 90+ streak</text>
  </g>
  <g class="small" font-size="24">
    <text x="716" y="514">✓ No deposit to start</text>
    <text x="716" y="556">✓ Withdraw with USDT</text>
