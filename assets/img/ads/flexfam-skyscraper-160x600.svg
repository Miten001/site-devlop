<svg xmlns="http://www.w3.org/2000/svg" width="160" height="600" viewBox="0 0 160 600" role="img" aria-label="FlexFam earn USDT daily banner">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#060b1d"/>
    <stop offset="0.54" stop-color="#102347"/>
    <stop offset="1" stop-color="#072b21"/>
  </linearGradient>
  <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#34e5a5"/>
    <stop offset="1" stop-color="#ffd061"/>
  </linearGradient>
  <linearGradient id="cta" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffd061"/>
    <stop offset="1" stop-color="#34e5a5"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#34e5a5" stop-opacity=".45"/>
    <stop offset="1" stop-color="#34e5a5" stop-opacity="0"/>
  </radialGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".36"/>
  </filter>
</defs>
<style>
  .brand{font-family:Inter,Arial,sans-serif;font-weight:900;letter-spacing:-0.04em;fill:#fff}
  .brand tspan{fill:#ffd061}
  .eyebrow{font-family:Inter,Arial,sans-serif;font-weight:800;letter-spacing:.16em;text-transform:uppercase;fill:#8df2c4}
  .headline{font-family:Inter,Arial,sans-serif;font-weight:900;letter-spacing:-0.055em;fill:#fff}
  .sub{font-family:Inter,Arial,sans-serif;font-weight:700;fill:#c9d6f4}
  .muted{font-family:Inter,Arial,sans-serif;font-weight:650;fill:#8ea0c7}
  .cta{font-family:Inter,Arial,sans-serif;font-weight:900;letter-spacing:.02em;fill:#071528}
  .small{font-family:Inter,Arial,sans-serif;font-weight:700;fill:#dfe8ff}
  .green{fill:#34e5a5}.gold{fill:#ffd061}.orange{fill:#ff9f2f}
</style>
<rect width="160" height="600" rx="11" fill="url(#bg)"/>

  <circle cx="131.2" cy="108.0" r="51.2" fill="url(#glow)" opacity=".75"/>
  <circle cx="19.2" cy="444.0" r="38.4" fill="#ff9f2f" opacity=".13"/>
  <path d="M12.8 120.0C44.8 36.0 75.2 54.0 112.0 12.0" fill="none" stroke="#34e5a5" stroke-opacity=".22" stroke-width="3"/>
  <path d="M80.0 588.0C105.6 492.0 131.2 498.0 153.6 378.0" fill="none" stroke="#ffd061" stroke-opacity=".18" stroke-width="4"/>
  <g opacity=".18" fill="#fff">
    <circle cx="28.8" cy="132.0" r="3"/><circle cx="68.8" cy="468.0" r="2.5"/><circle cx="120.0" cy="348.0" r="3.5"/>
  </g>

  <text x="18" y="52" class="brand" font-size="24">Flex<tspan>Fam</tspan></text>
  <text x="80" y="104" class="eyebrow" font-size="10" text-anchor="middle">JOIN FREE</text>
  <text x="80" y="182" class="headline green" font-size="36" text-anchor="middle">$5.50</text>
  <text x="80" y="214" class="headline green" font-size="30" text-anchor="middle">/day</text>
  <text x="80" y="262" class="sub" font-size="13" text-anchor="middle">Daily streak</text>
  <text x="80" y="286" class="sub" font-size="13" text-anchor="middle">Social tasks</text>
  <text x="80" y="310" class="sub" font-size="13" text-anchor="middle">Cloud mining</text>
  <g opacity=".9">
    <circle cx="80" cy="382" r="42" fill="#0c1a34" stroke="#34e5a5" stroke-opacity=".5"/>
    <text x="80" y="374" class="small" font-size="13" text-anchor="middle">USDT</text>
    <text x="80" y="399" class="gold" font-size="26" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-weight="900">₮</text>
  </g>
  <rect x="22" y="492" width="116" height="42" rx="21" fill="url(#cta)"/>
  <text x="80" y="519" class="cta" font-size="13" text-anchor="middle">START NOW</text>
  <text x="80" y="562" class="muted" font-size="10" text-anchor="middle">flexfam.github.io</text>

