<svg xmlns="http://www.w3.org/2000/svg" width="160" height="600" viewBox="0 0 160 600" role="img" aria-label="FlexFam Skyscraper 160x600">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sky160_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814"/>
      <stop offset="40%" stop-color="#091326"/>
      <stop offset="100%" stop-color="#041a15"/>
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="sky160_card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(16, 35, 71, 0.75)"/>
      <stop offset="100%" stop-color="rgba(7, 18, 38, 0.9)"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="sky160_borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 245, 155, 0.6)"/>
      <stop offset="50%" stop-color="rgba(255, 208, 67, 0.4)"/>
      <stop offset="100%" stop-color="rgba(0, 229, 255, 0.2)"/>
    </linearGradient>

    <!-- Gold Text Gradient -->
    <linearGradient id="sky160_gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff076"/>
      <stop offset="50%" stop-color="#ffd043"/>
      <stop offset="100%" stop-color="#ff9a00"/>
    </linearGradient>

    <!-- Emerald Text Gradient -->
    <linearGradient id="sky160_emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f59b"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="sky160_btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd043"/>
      <stop offset="45%" stop-color="#00f59b"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <!-- 3D Coin Outer Rim Gradient -->
    <linearGradient id="sky160_goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe484"/>
      <stop offset="40%" stop-color="#ffd043"/>
      <stop offset="70%" stop-color="#e69500"/>
      <stop offset="100%" stop-color="#804a00"/>
    </linearGradient>

    <!-- 3D Coin Inner Face Gradient -->
    <radialGradient id="sky160_coinFace" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3bf6ad"/>
      <stop offset="60%" stop-color="#14966a"/>
      <stop offset="100%" stop-color="#08523a"/>
    </radialGradient>

    <!-- Ambient Glow Filters -->
    <radialGradient id="sky160_glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f59b" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#00f59b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00f59b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sky160_glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd043" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#ff9a00" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ff9a00" stop-opacity="0"/>
    </radialGradient>

    <filter id="sky160_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <style>
    .brand { font-family: Inter, system-ui, -apple-system, Roboto, 'Segoe UI', Arial, sans-serif; font-weight: 900; }
    .title { font-family: Inter, system-ui, -apple-system, Roboto, 'Segoe UI', Arial, sans-serif; font-weight: 800; }
    .body { font-family: Inter, system-ui, -apple-system, Roboto, 'Segoe UI', Arial, sans-serif; font-weight: 600; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 700; }
  </style>


  <rect width="160" height="600" rx="14" fill="url(#sky160_bg)"/>
  <rect width="160" height="600" rx="14" fill="none" stroke="url(#sky160_borderGrad)" stroke-width="1.3"/>

  <circle cx="80" cy="50" r="90" fill="url(#sky160_glowGold)"/>
  <circle cx="80" cy="240" r="100" fill="url(#sky160_glowGreen)"/>
  <circle cx="80" cy="460" r="90" fill="url(#sky160_glowGold)"/>

  <!-- Logo -->
  <g transform="translate(0, 22)">
    <text x="80" y="26" class="brand" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5px">Flex<tspan fill="url(#sky160_gold)">Fam</tspan></text>
    <g transform="translate(20, 36)">
      <rect x="0" y="0" width="120" height="18" rx="9" fill="rgba(0,245,155,0.15)" stroke="rgba(0,245,155,0.3)" stroke-width="1"/>
      <path transform="translate(8, 2) scale(0.8)" d="M7 1L1 9h5l-2 7 8-9H7l2-7z" fill="#00f59b"/>
      <text x="64" y="13" class="title" font-size="8.5" fill="#00f59b" text-anchor="middle" letter-spacing="0.6px">SOCIAL REWARDS</text>
    </g>
  </g>

  <!-- Big USDT Coin -->
  
    <g transform="translate(80, 138)" filter="url(#sky160_shadow)">
      <!-- Outer Gold Bevel -->
      <circle cx="0" cy="0" r="34" fill="url(#sky160_goldRim)"/>
      <!-- Inner Green Face -->
      <circle cx="0" cy="0" r="29.24" fill="url(#sky160_coinFace)"/>
      <circle cx="0" cy="0" r="29.24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.7"/>
      
      <!-- Tether T & Rings Vector -->
      <g transform="scale(1.4166666666666667) translate(-12, -12)">
        <!-- Top Bar -->
        <rect x="5.5" y="6" width="13" height="3" rx="1" fill="#ffffff"/>
        <!-- Vertical Stem -->
        <rect x="10.5" y="8" width="3" height="10" rx="0.8" fill="#ffffff"/>
        <!-- Ring Arc Left & Right -->
        <path d="M 6 12.5 C 6 11 8.5 10 12 10 C 15.5 10 18 11 18 12.5 C 18 14 15.5 15 12 15 C 8.5 15 6 14 6 12.5 Z" fill="none" stroke="#ffffff" stroke-width="1.8"/>
      </g>
      <!-- Top Specular Highlight -->
      <ellipse cx="-8.5" cy="-11.899999999999999" rx="11.899999999999999" ry="6.12" fill="rgba(255,255,255,0.35)"/>
    </g>
  

  <!-- Value Card -->
  <g transform="translate(12, 192)">
    <rect width="136" height="130" rx="12" fill="url(#sky160_card)" stroke="rgba(0,245,155,0.3)" stroke-width="1.2"/>
    <text x="68" y="24" class="title" font-size="10" fill="#9fb0d5" text-anchor="middle">EARN DAILY</text>
    <text x="68" y="60" class="brand" font-size="32" fill="url(#sky160_emerald)" text-anchor="middle" letter-spacing="-0.8px">$5.50</text>
    <text x="68" y="80" class="brand" font-size="13" fill="#ffffff" text-anchor="middle">USDT / DAY</text>
    <text x="68" y="104" class="title" font-size="9" fill="#ffd043" text-anchor="middle">Day 90+ Streak</text>
    <text x="68" y="118" class="body" font-size="8.5" fill="#8ea5c8" text-anchor="middle">Instant Withdrawal</text>
  </g>

  <!-- Features list -->
  <g transform="translate(16, 342)">
    <g transform="translate(0, 0)">
      <path transform="translate(0, 2) scale(0.9)" d="M1 5l3 3L11 1" fill="none" stroke="#00f59b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="18" y="11" class="title" font-size="11" fill="#ffffff">Telegram Tasks</text>
    </g>
    <g transform="translate(0, 28)">
      <path transform="translate(0, 2) scale(0.9)" d="M1 5l3 3L11 1" fill="none" stroke="#00f59b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="18" y="11" class="title" font-size="11" fill="#ffffff">YouTube &amp; Social</text>
    </g>
    <g transform="translate(0, 56)">
      <path transform="translate(0, 2) scale(0.9)" d="M1 5l3 3L11 1" fill="none" stroke="#00f59b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="18" y="11" class="title" font-size="11" fill="#ffffff">Free Mining Rigs</text>
    </g>
    <g transform="translate(0, 84)">
      <path transform="translate(0, 2) scale(0.9)" d="M1 5l3 3L11 1" fill="none" stroke="#00f59b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="18" y="11" class="title" font-size="11" fill="#ffffff">BEP20 &amp; UPI Pay</text>
    </g>
  </g>

  <!-- Big CTA at bottom -->
  <g transform="translate(12, 480)">
    <rect width="136" height="46" rx="23" fill="url(#sky160_btn)" filter="url(#sky160_shadow)"/>
    <rect x="2" y="2" width="132" height="20" rx="10" fill="rgba(255,255,255,0.35)"/>
    <text x="68" y="28" class="brand" font-size="14" fill="#051020" text-anchor="middle" letter-spacing="0.3px">JOIN FREE ➔</text>
    <text x="68" y="60" class="title" font-size="9" fill="#7ce6ae" text-anchor="middle">✓ 100% FREE TO JOIN</text>
  </g>
</svg>